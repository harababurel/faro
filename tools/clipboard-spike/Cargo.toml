[package]
name = "clipboard-spike"
version = "0.0.0"
edition = "2024"
publish = false
description = "Phase 0 spike for D89: who reads kitty's OSC 5522 clipboard reply"

# Standalone on purpose: builds in seconds (no libsignal) and stays out of the
# faro workspace and its lint gate.
[workspace]

[dependencies]
base64 = "0.22.1"
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-util = "0.3.34"
mio = { version = "1", features = ["os-poll", "os-ext"] }
rustix = { version = "1", features = ["std"] }
tokio = { version = "1.53.2", features = ["rt", "macros", "time"] }
