# getfaro.dev: the static site (WEBSITE.md §6.8, §6.10).
#
# A template kept in the repo. Copy it into nginx's config (don't `include` it from
# the repo: certbot edits the file it finds), then run
#   certbot --nginx -d getfaro.dev -d www.getfaro.dev
# Before reloading nginx, replace PLAUSIBLE_SCRIPT below (see site/deploy/README.md, step 5).

server {
    server_name getfaro.dev;
    root  /srv/getfaro.dev/current;
    index index.html;

    # Kept 30 days (site/deploy/logrotate/getfaro), as the privacy policy says.
    # Their own folder: Debian's /etc/logrotate.d/nginx already matches /var/log/nginx/*.log.
    access_log /var/log/nginx/getfaro/access.log;
    error_log  /var/log/nginx/getfaro/error.log;

    gzip_static on;                       # serve the build's precompressed .gz files
    gzip on;  gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml application/wasm;

    # Note: add_header in a location drops the server-level ones, so every location
    # includes the snippet.
    set $csp "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self'; img-src 'self' data:; style-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'";

    location / {
        try_files $uri $uri.html $uri/ =404;      # /privacy -> privacy.html
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/getfaro-headers.conf;
    }

    # Content-hashed assets never change.
    location ~* "\.[0-9a-f]{8,}\.(js|css|woff2|wasm|svg|png|webp|jpg)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/getfaro-headers.conf;
    }

    # Emergency switch (WEBSITE.md §6.8): uncomment to stop preloading the demo, then `nginx -s reload`.
    # location = /demo/manifest.json { try_files /demo/manifest.no-preload.json =404; }

    # Plausible, same origin (WEBSITE.md §6.9), so the CSP stays 'self'.
    # PLAUSIBLE_SCRIPT: the per-site script name from Plausible's snippet for getfaro.dev
    # (Site settings > General > Site installation): for /js/pa-AbCdEf123.js, write pa-AbCdEf123.
    location = /js/s.js {
        proxy_pass       http://127.0.0.1:8000/js/PLAUSIBLE_SCRIPT.js;
        proxy_set_header Host plausible.harababurel.com;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=86400";
        include /etc/nginx/snippets/getfaro-headers.conf;
    }
    location = /api/event {
        proxy_pass         http://127.0.0.1:8000/api/event;
        proxy_http_version 1.1;
        proxy_set_header   Host              plausible.harababurel.com;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        include /etc/nginx/snippets/getfaro-headers.conf;
    }

    listen 80;   # certbot adds `listen 443 ssl` and the certificate lines. Add `listen [::]:80;` for IPv6.
}

server {
    server_name www.getfaro.dev;
    return 301 https://getfaro.dev$request_uri;
    listen 80;   # certbot adds TLS
}
