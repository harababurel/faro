# The self-hosted Plausible dashboard (WEBSITE.md §6.9, §6.10).
#
# Copy into nginx's config, then run
#   certbot --nginx -d plausible.harababurel.com
# Plausible listens on 127.0.0.1:8000 only (site/deploy/plausible/compose.override.yml).

server {
    server_name plausible.harababurel.com;
    access_log /var/log/nginx/plausible.access.log;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;   # live dashboard (websocket)
        proxy_set_header   Connection        $plausible_connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    listen 80;   # certbot adds TLS and the redirect. Add `listen [::]:80;` if the server has IPv6.
}

# "upgrade" only for websocket requests, so ordinary requests keep their connection.
map $http_upgrade $plausible_connection_upgrade {
    default upgrade;
    ''      close;
}
