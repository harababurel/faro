name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # Installs the toolchain pinned in rust-toolchain.toml (with rustfmt and clippy).
      - name: Install Rust
        run: rustup toolchain install && rustc --version

      # libsignal's protobufs are compiled at build time.
      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

  # The shared code builds for the browser (M13): no protoc needed, nothing native.
  wasm:
    name: wasm32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Installs the toolchain and the wasm32 target pinned in rust-toolchain.toml.
      - name: Install Rust
        run: rustup toolchain install && rustc --version

      - uses: Swatinem/rust-cache@v2

      - name: Clippy (faro-core, wasm32)
        run: cargo clippy -p faro-core --target wasm32-unknown-unknown --no-default-features --locked -- -D warnings

      # The shared app: everything but the terminal binary (M13).
      - name: Clippy (faro-app, wasm32)
        run: cargo clippy -p faro-app --target wasm32-unknown-unknown --locked -- -D warnings

      # The web demo (M13). A library for now: Phase 3 makes it the wasm module.
      - name: Build (faro-web, wasm32)
        run: cargo build -p faro-web --target wasm32-unknown-unknown --locked

      - name: Clippy (faro-web, wasm32)
        run: cargo clippy -p faro-web --target wasm32-unknown-unknown --locked -- -D warnings
