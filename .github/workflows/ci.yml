name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # Installs the toolchain pinned in rust-toolchain.toml (with rustfmt and clippy).
      - name: Install Rust
        run: rustup toolchain install && rustc --version

      # libsignal's protobufs are compiled at build time.
      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

  # The shared code builds for the browser (M13): no protoc needed, nothing native.
  wasm:
    name: wasm32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Installs the toolchain and the wasm32 target pinned in rust-toolchain.toml.
      - name: Install Rust
        run: rustup toolchain install && rustc --version

      - uses: Swatinem/rust-cache@v2

      - name: Clippy (faro-core, wasm32)
        run: cargo clippy -p faro-core --target wasm32-unknown-unknown --no-default-features --locked -- -D warnings

      # The shared app: everything but the terminal binary (M13).
      - name: Clippy (faro-app, wasm32)
        run: cargo clippy -p faro-app --target wasm32-unknown-unknown --locked -- -D warnings

      - name: Clippy (faro-web, wasm32)
        run: cargo clippy -p faro-web --target wasm32-unknown-unknown --locked -- -D warnings

      # The web demo's module, built as the site serves it (build.sh), and
      # its size budget (WEBSITE.md §7 Phase 3): at most 1.5 MB gzipped.
      - name: wasm-bindgen version (from Cargo.lock)
        id: bindgen
        run: echo "version=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print; exit }' Cargo.lock)" >> "$GITHUB_OUTPUT"

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.bindgen.outputs.version }}

      - name: Build the demo and check its size
        run: |
          crates/faro-web/build.sh
          size=$(gzip -9 < crates/faro-web/www/pkg/faro_web_bg.wasm | wc -c)
          echo "faro_web_bg.wasm: $size bytes gzipped (budget: 1572864)"
          test "$size" -le 1572864

  # The getfaro.dev static site (M13 Phase 1): build it the way the server
  # does, then run the site checks (WEBSITE.md §6.8): links, no third-party
  # requests, no cookies, no inline code, no leftover placeholders, the
  # §6.6 size budget and the no-JS render. Deployment stays manual on the
  # server (site/deploy/update.sh); there are no deploy steps and no secrets.
  site:
    name: site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Installs the toolchain pinned in rust-toolchain.toml. faro-site needs
      # nothing else: no protoc, no libsignal (§6.8).
      - name: Install Rust
        run: rustup toolchain install && rustc --version

      - uses: Swatinem/rust-cache@v2

      # A fresh dir: build.sh refuses a non-empty one (stale hashed files).
      # brotli isn't on the runner: build.sh skips the .br twins, fine.
      - name: Build the site
        run: site/build.sh "$RUNNER_TEMP/site"

      # The no-JS check runs on the runner's Chrome; if there is none,
      # check.py skips it with a notice.
      - name: Check the site
        run: CHROME=$(command -v google-chrome) python3 site/check.py "$RUNNER_TEMP/site"
