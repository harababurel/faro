name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the toolchain pinned in rust-toolchain.toml (with rustfmt and clippy).
      - name: Install Rust
        run: rustup toolchain install && rustc --version

      # libsignal's protobufs are compiled at build time.
      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

  # Dependencies (D149): known vulnerabilities, licences, and where crates
  # come from, against the committed Cargo.lock. Config in deny.toml.
  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the toolchain pinned in rust-toolchain.toml (cargo metadata).
      - name: Install Rust
        run: rustup toolchain install && rustc --version

      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny@0.20.2

      - name: cargo deny
        run: cargo deny --locked check

  # The shared code builds for the browser (M13): no protoc needed, nothing native.
  wasm:
    name: wasm32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the toolchain and the wasm32 target pinned in rust-toolchain.toml.
      - name: Install Rust
        run: rustup toolchain install && rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Clippy (faro-core, wasm32)
        run: cargo clippy -p faro-core --target wasm32-unknown-unknown --no-default-features --locked -- -D warnings

      # The shared app: everything but the terminal binary (M13).
      - name: Clippy (faro-app, wasm32)
        run: cargo clippy -p faro-app --target wasm32-unknown-unknown --locked -- -D warnings

      - name: Clippy (faro-web, wasm32)
        run: cargo clippy -p faro-web --target wasm32-unknown-unknown --locked -- -D warnings

      # The web demo's module, built as the site serves it (build.sh), and
      # its size budget (WEBSITE.md §7 Phase 3): at most 1.5 MB gzipped.
      - name: wasm-bindgen version (from Cargo.lock)
        id: bindgen
        run: echo "version=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print; exit }' Cargo.lock)" >> "$GITHUB_OUTPUT"

      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: wasm-bindgen@${{ steps.bindgen.outputs.version }}

      - name: Build the demo and check its size
        run: |
          crates/faro-web/build.sh
          size=$(gzip -9 < crates/faro-web/www/pkg/faro_web_bg.wasm | wc -c)
          echo "faro_web_bg.wasm: $size bytes gzipped (budget: 1572864)"
          test "$size" -le 1572864

  # The getfaro.dev static site (M13 Phase 1): build it the way the server
  # does, then run the site checks (WEBSITE.md §6.8): links, no third-party
  # requests, no cookies, no inline code, no leftover placeholders, the
  # §6.6 size budget, the demo's own wasm budget (D119) and the no-JS
  # render. Deployment stays manual on the server (site/deploy/update.sh);
  # there are no deploy steps and no secrets.
  site:
    name: site
    runs-on: ubuntu-latest
    # The Rust site build plus the headless browser suite (§6.8, 4.6):
    # the suite itself budgets 180 s (GitHub runners are slower than local); 30 min is the job's safety margin.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The site checks include Node harnesses (analytics regression,
      # browser_test.mjs): Node 22 for its built-in WebSocket/fetch.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Installs the toolchain and the wasm32 target pinned in
      # rust-toolchain.toml. faro-site needs nothing else: no protoc, no
      # libsignal (§6.8); build.sh also builds the demo's wasm module.
      - name: Install Rust
        run: rustup toolchain install && rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # site/build.sh runs crates/faro-web/build.sh, which needs
      # wasm-bindgen-cli at the wasm-bindgen crate's version.
      - name: wasm-bindgen version (from Cargo.lock)
        id: bindgen
        run: echo "version=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print; exit }' Cargo.lock)" >> "$GITHUB_OUTPUT"

      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: wasm-bindgen@${{ steps.bindgen.outputs.version }}

      # A fresh dir: build.sh refuses a non-empty one (stale hashed files).
      # brotli isn't on the runner: build.sh skips the .br twins, fine.
      # wasm-opt (binaryen) isn't either: the size budget is checked without it.
      - name: Build the site
        run: site/build.sh "$RUNNER_TEMP/site"

      # The no-JS render check and the browser suite both need the
      # runner's Chrome; it's preinstalled, but a missing one must fail
      # the job, not silently skip coverage. Exported for every later step.
      - name: Find Chrome
        run: |
          chrome=$(command -v google-chrome)
          test -n "$chrome" || { echo "google-chrome not found on the runner" >&2; exit 1; }
          echo "CHROME=$chrome" >> "$GITHUB_ENV"
          "$chrome" --version

      - name: Check the site
        run: python3 site/check.py "$RUNNER_TEMP/site"

      # The demo loader's analytics/responsive rules in a fake DOM (§6.9,
      # 4.4/4.5b): pure Node, no browser.
      - name: Demo loader checks (Node)
        run: node site/tools/test_demo_analytics.mjs

      # The browser harness's own pure parts: nginx header parsing, the
      # network audit filter, the CLI.
      - name: Browser harness unit checks
        run: node --test site/tools/browser/parse.test.mjs

      # The real-wasm headless suite (4.6): desktop core flow, phone and
      # privacy scenarios, panel controls, global audit. Its own 100 s
      # budget bounds it; the report and up to 8 screenshots land in
      # $RUNNER_TEMP/browser.
      - name: Browser suite (headless Chrome)
        run: node site/tools/browser_test.mjs "$RUNNER_TEMP/site" --out "$RUNNER_TEMP/browser" --budget 180

      # Only on failure: the harness writes nothing on green runs beyond
      # the report; warn (not fail) when the folder is absent.
      - name: Upload browser artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-report
          path: ${{ runner.temp }}/browser/
          if-no-files-found: warn
          retention-days: 7
