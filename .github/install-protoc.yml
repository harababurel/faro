# dist's github-build-setup steps (inserted into release.yml's
# build-local-artifacts job right after checkout). Needed because
# ubuntu-22.04's apt protobuf-compiler (protoc 3.12) is too old for
# libsignal-service's proto3-optional protos; the pinned protoc from
# the protobuf releases works on both runner arches and prost-build
# finds it via PROTOC. Mirrored by hand in release.yml (allow-dirty).
- name: Install a recent protoc (Linux)
  if: runner.os == 'Linux'
  shell: bash
  run: |
    case "$(uname -m)" in
      x86_64) protoc_arch=linux-x86_64 ;;
      aarch64) protoc_arch=linux-aarch_64 ;;
      *) echo "no protoc release for $(uname -m)" >&2; exit 1 ;;
    esac
    curl -fsSL -o protoc.zip \
      "https://github.com/protocolbuffers/protobuf/releases/download/v25.6/protoc-25.6-${protoc_arch}.zip"
    sudo unzip -o protoc.zip -d /usr/local bin/protoc
    sudo unzip -o protoc.zip -d /usr/local 'include/*'
    echo "PROTOC=/usr/local/bin/protoc" >> "$GITHUB_ENV"
    /usr/local/bin/protoc --version
