[package]
name = "ratzilla-spike"
description = "M13 Phase 0 spike (throwaway): faro frames through Ratzilla's WebGL2 backend"
version = "0.0.0"
edition = "2024"
publish = false

# Not a member of faro's workspace: a throwaway spike, kept out of the quality gate.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
ratzilla = "0.3.1"
ratatui = { version = "0.30.2", default-features = false }
serde_json = "1"
wasm-bindgen = "=0.2.129"
web-sys = { version = "0.3", features = ["Window", "Performance"] }

[profile.release]
opt-level = "s"
lto = true
