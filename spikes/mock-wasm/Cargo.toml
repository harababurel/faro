[package]
name = "mock-wasm-spike"
description = "M13 Phase 0 spike (throwaway): faro-core's mock backend on wasm32"
version = "0.0.0"
edition = "2024"
publish = false

# Not a member of faro's workspace: a throwaway spike, kept out of the quality gate.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
faro-core = { path = "../../crates/faro-core", default-features = false }
tokio = { version = "1.53.2", features = ["sync"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
faro-core = { path = "../../crates/faro-core", default-features = false, features = ["wasm-spike"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4.79"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.53.2", features = ["rt", "time", "test-util", "macros"] }
