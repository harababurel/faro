[workspace]
resolver = "3"
members = ["crates/faro", "crates/faro-core"]

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
repository = "https://github.com/harababurel/faro"
publish = false

[workspace.dependencies]
faro-core = { path = "crates/faro-core" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that are more noise than signal for this project.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
strip = true
