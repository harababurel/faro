[workspace]
resolver = "3"
members = [
    "crates/faro",
    "crates/faro-app",
    "crates/faro-core",
    "crates/faro-presage",
    "crates/faro-site",
    "crates/faro-web",
]

[workspace.package]
version = "0.1.7"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
repository = "https://github.com/harababurel/faro"
publish = false

[workspace.dependencies]
faro-app = { path = "crates/faro-app" }
# Only for the `faro` binary's `vendored-openssl` feature (D133): the same
# crate the patch below points at whisperfish's fork, so features unify.
libsqlite3-sys = "0.36.0"
# Without SQLite unless a crate asks for it (`features = ["sqlite"]`): the
# web demo uses the in-memory store (M13).
faro-core = { path = "crates/faro-core", default-features = false }
faro-presage = { path = "crates/faro-presage" }
faro-web = { path = "crates/faro-web" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that are more noise than signal for this project.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# D27: rules enforced by tools. Exceptions use `#[expect(lint, reason = "...")]`,
# never a bare `#[allow]`, so each one is justified and goes stale loudly.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
# No panics outside tests (clippy.toml relaxes these in tests).
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
dbg_macro = "warn"
indexing_slicing = "warn"
# `process::exit` skips destructors (e.g. the log flush guard).
exit = "warn"
# Nothing writes to the terminal behind the TUI's back.
print_stdout = "warn"
print_stderr = "warn"
# No `_ =>` on enums: adding a variant (event, action, status) must force a decision
# at every match instead of being silently ignored.
wildcard_enum_match_arm = "warn"
# Never block the UI: see `disallowed-methods` in clippy.toml.
disallowed_methods = "warn"

# presage's store needs SQLCipher; faro's own database (sqlx) links the same
# library, so both use whisperfish's build of it (as presage does).
[patch.crates-io]
libsqlite3-sys = { git = "https://github.com/whisperfish/rusqlite", rev = "2a42b3354c9194700d08aa070f70a131a470e7dc" }

# A contact list from another linked presage client could panic the receive
# loop (D151). Fixed on our fork until upstream merges it; drop this then.
[patch."https://github.com/whisperfish/libsignal-service-rs"]
libsignal-service = { git = "https://github.com/harababurel/libsignal-service-rs", rev = "7a8c7fa4f3b3c88d0ea385fc88033d2742a99d8d" }

[profile.release]
lto = "thin"
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
