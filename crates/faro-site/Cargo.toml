[package]
name = "faro-site"
description = "getfaro.dev site generator (M13): fills site/template from faro's own code and content-hashes the assets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# The server builds this with rustup alone (WEBSITE.md §6.8): nothing here
# may pull in faro-presage, crossterm, notify or anything that needs
# protoc/cmake/libsignal. tokio is already in the tree through faro-core
# (its runtime shim); the poster build uses that same runtime, nothing more.
# resvg (the OG image rasteriser, §6.4) is pure Rust with no system-font
# feature: the generator loads only the fonts bundled under fonts/.
[dependencies]
faro-app.workspace = true
faro-core.workspace = true
faro-web.workspace = true
ratatui = { version = "0.30.2", default-features = false, features = ["std", "layout-cache", "underline-color"] }
resvg = { version = "0.48.1", default-features = false, features = ["text"] }
# The demo's gzipped wasm size for the manifest (demo.rs); already in the
# tree through resvg → tiny-skia → png, so it costs no extra compilation,
# and site/build.sh's `gzip -9` uses the same level.
flate2 = "1.1"
# OG glyph coverage and phone SVG outlines (scene/); already in the tree
# through resvg → usvg, so it costs no extra compilation.
skrifa = "0.44"
# UAX #29 grapheme clusters for the phone frames' outliner
# (scene/phone_font.rs); already in the tree through faro-app.
unicode-segmentation = "1.13.3"
sha2 = "0.11"
tokio = { version = "1.53.2", default-features = false, features = ["rt", "time"] }

[dev-dependencies]
# Only the demo test reads its own manifest back (demo.rs); already in the
# tree through faro-core.
serde_json = "1.0.151"
