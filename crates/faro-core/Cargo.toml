[package]
name = "faro-core"
description = "Domain types, backend trait, store and config for faro"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
etcetera = "0.11.0"
fastrand = "2.5.0"
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["macros", "rt", "sync", "time"] }
tracing = "0.1.44"
uuid = "1.27.0"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["rt", "macros", "test-util"] }
