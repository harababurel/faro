[package]
name = "faro-core"
description = "Domain types, backend trait, store and config for faro"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["native"]
# Everything that needs an operating system: the SQLite store and the XDG paths.
native = ["dep:sqlx", "dep:etcetera", "dep:rustix"]
# M13 Phase 0 spike (throwaway; replaced by Phase 2's seams): the mock backend on
# wasm32-unknown-unknown, with browser timers and clock instead of tokio's.
# cargo build -p faro-core --target wasm32-unknown-unknown --no-default-features --features wasm-spike
wasm-spike = ["dep:gloo-timers", "dep:wasm-bindgen-futures", "dep:web-time"]

[dependencies]
# Already in the lock file (0.22.1); OSC 5522 payloads (D89).
base64 = "0.22.1"
etcetera = { version = "0.11.0", optional = true }
fastrand = "2.5.0"
# Already in the lock file; `process` adds `getuid` for the demo directory checks (D87).
rustix = { version = "1.1.5", default-features = false, features = ["std", "process"], optional = true }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"], optional = true }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["macros", "rt", "sync", "time"] }
toml_edit = "0.25.15"
tracing = "0.1.44"
uuid = "1.27.0"
gloo-timers = { version = "0.3.0", features = ["futures"], optional = true }
wasm-bindgen-futures = { version = "0.4.79", optional = true }
web-time = { version = "1.1.0", optional = true }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["rt", "macros", "test-util"] }
