[package]
name = "faro"
description = "A terminal client for Signal, built for people who live in tmux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
faro-core.workspace = true
tokio = { version = "1.53.2", features = ["rt", "macros", "signal"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["rt", "macros", "time", "test-util"] }
