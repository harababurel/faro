[package]
name = "faro"
description = "A terminal client for Signal, built for people who live in tmux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
crossterm = { version = "0.29.0", features = ["event-stream", "osc52"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
faro-core.workspace = true
faro-presage.workspace = true
gethostname = "1.0"
futures-util = "0.3.34"
jiff = "0.2.38"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache", "underline-color"] }
tokio = { version = "1.53.2", features = ["rt", "macros", "process", "signal", "sync", "time", "fs", "io-util"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
nucleo-matcher = "0.3.1"
notify = "8.2.0"
qrcode = { version = "0.14", default-features = false }
uuid = "1.27.0"

[dev-dependencies]
insta = "1.49.0"
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["rt", "macros", "time", "test-util"] }
uuid = "1.27.0"
