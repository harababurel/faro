<!doctype html>
<!-- faro's web demo, test page (M13 Phase 3). Build with ../build.sh, then
     serve this folder (any static server) or open dist/demo.html from
     tools/bundle.py.
     ?cols=120&rows=34  a fixed grid (default: fill the window)
     ?bench             measure frame times (also: await window.bench())
     ?unfocused         start without the keys (as on the website)
     ?record            the README demo's mock: everyone answers within
                        seconds (tools/demo_gif) -->
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>faro · web demo</title>
<style>
  @font-face { font-family: "JetBrains Mono"; src: url(fonts/JetBrainsMono-Regular.woff2) format("woff2"); font-weight: 400; font-style: normal; }
  @font-face { font-family: "JetBrains Mono"; src: url(fonts/JetBrainsMono-Bold.woff2) format("woff2"); font-weight: 700; font-style: normal; }
  @font-face { font-family: "JetBrains Mono"; src: url(fonts/JetBrainsMono-Italic.woff2) format("woff2"); font-weight: 400; font-style: italic; }
  html, body { margin: 0; height: 100%; background: #101216; overflow: hidden; }
  #panel { width: 100vw; height: 100vh; }
  canvas { display: block; }
  #panel.bell { outline: 2px solid #e8a33d; outline-offset: -2px; }
  #exited { position: fixed; inset: 0; display: grid; place-items: center; background: #101216b0; }
  #exited[hidden] { display: none; }
  #exited button { font: 16px "JetBrains Mono", monospace; color: #e6e6e6; background: #1b1e24; border: 1px solid #e8a33d; padding: 10px 18px; cursor: pointer; }
  #stats { position: fixed; right: 6px; bottom: 4px; font: 11px monospace; color: #7c838f; }
</style>
<div id="panel"><canvas id="faro" role="application" aria-label="faro, a terminal client for Signal, running in your browser with made-up contacts"></canvas></div>
<div id="exited" hidden><button id="again">faro exited · ↺ start again</button></div>
<div id="stats"></div>
<script type="module">
  const { default: init, start, start_recording } = await import(window.FARO_JS ?? "./pkg/faro_web.js");
  await init(window.FARO_WASM ? { module_or_path: window.FARO_WASM } : undefined);
  const q = new URLSearchParams(location.search);
  const font = "JetBrains Mono", size = Number(q.get("size") ?? 14);
  await Promise.all(["", "bold ", "italic "].map((w) => document.fonts.load(`${w}${size}px "${font}"`)));
  const canvas = document.getElementById("faro");
  const launch = q.has("record") ? start_recording : start;
  const boot = async () => {
    window.demo = await launch(canvas, font, size, Number(q.get("cols") ?? 0), Number(q.get("rows") ?? 0));
  };
  await boot();
  const demo = window.demo;
  if (!q.has("unfocused")) canvas.focus();
  // faro quit (Ctrl+Q, Ctrl+C twice): offer a fresh demo (WEBSITE.md §4.5).
  const exited = document.getElementById("exited");
  canvas.addEventListener("faro-exit", () => {
    exited.hidden = false;
    document.getElementById("again").focus();
  });
  document.getElementById("again").addEventListener("click", async () => {
    exited.hidden = true;
    window.demo.free();
    await boot();
    canvas.focus();
  });
  // faro rang: flash the panel's border (WEBSITE.md §4.8).
  window.bells = 0;
  const panel = document.getElementById("panel");
  canvas.addEventListener("faro-bell", () => {
    window.bells++;
    panel.classList.add("bell");
    setTimeout(() => panel.classList.remove("bell"), 150);
  });
  // Frame times (WEBSITE.md §7 Phase 3: under 4 ms): `repaint` paints every
  // row; `frame` renders, diffs and paints a whole frame from scratch.
  const stats = document.getElementById("stats");
  const measure = async (run, n = 60) => {
    const times = [];
    for (let i = 0; i < n; i++) {
      times.push(run());
      await new Promise(requestAnimationFrame);
    }
    times.sort((a, b) => a - b);
    const avg = times.reduce((a, b) => a + b, 0) / n;
    return { avg: +avg.toFixed(2), p50: +times[n >> 1].toFixed(2), p95: +times[Math.floor(n * 0.95)].toFixed(2), max: +times.at(-1).toFixed(2) };
  };
  window.bench = async () => {
    const result = { repaint: await measure(() => window.demo.repaint()), frame: await measure(() => window.demo.frame()) };
    stats.textContent = `repaint avg ${result.repaint.avg} ms · frame avg ${result.frame.avg} ms, p95 ${result.frame.p95}`;
    return result;
  };
  window.stats = q.has("bench") ? await window.bench() : {};
  window.done = true;
</script>
</html>
