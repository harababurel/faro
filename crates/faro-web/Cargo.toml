[package]
name = "faro-web"
description = "faro's web demo (M13): the shared app on the mock, in the browser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# `cdylib`: the wasm module the page loads; `rlib`: native tests.
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
faro-app.workspace = true
faro-core.workspace = true
jiff = "0.2.38"
js-sys = "0.3.106"
ratatui = { version = "0.30.2", default-features = false, features = ["std", "layout-cache", "underline-color"] }
tokio = { version = "1.53.2", default-features = false, features = ["sync"] }
unicode-width = "0.2.2"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = [
    "CanvasRenderingContext2d",
    "CssStyleDeclaration",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "Performance",
    "TextMetrics",
    "Window",
] }

[dev-dependencies]
tokio = { version = "1.53.2", features = ["rt", "macros", "time", "test-util"] }
